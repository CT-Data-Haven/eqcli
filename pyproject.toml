[project]
name = "eqcli"
version = "0.1.0"
description = "In-house tools for equity reports at DataHaven"
readme = "README.md"
authors = [
    { name = "camille-s", email = "camille.seaberry@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "click>=8.3.1",
    "pandas>=3.0.0",
]

[project.scripts]
eqcli = "eqcli:main"

[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "pep440"
version_provider = "uv"
update_changelog_on_bump = true
major_version_zero = true

[dependency-groups]
dev = [
    "ruff>=0.15.1",
]
